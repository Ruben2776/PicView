name: Notarize PicView macOS
run-name: workflow release signing and notarization on macOS

on: workflow_dispatch

jobs:
  build-and-notarize:
    runs-on: macos-latest

    # One job per architecture. macos-latest is Apple silicon; the x64 job cross-publishes osx-x64.
    # Magick.NET 15 dropped Intel macOS, so the x64 job sets MagickLegacy=true: the projects then use
    # Magick.NET 14.x (see src/Directory.Build.props) and compile against its older names (MAGICK_LEGACY).
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64
            macos-architecture: arm64
            magick-package: Magick.NET-Q8-arm64
            magick-legacy: 'false'
          - platform: x64
            macos-architecture: x86_64
            magick-package: Magick.NET-Q8-x64
            magick-legacy: 'true'

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Step 2: Setup .NET 11 SDK
      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.x'

      # Step 3: Clear VersionSuffix and get version from Directory.Build.props using PowerShell
      # (as ReleaseSignWindows.yaml does), so the release build and file names have no suffix
      - name: Get version from Directory.Build.props
        id: get-version
        run: pwsh -File "${{ github.workspace }}/Build/Get-VersionInfo.ps1" -ClearVersionSuffix

      # Step 4: Restore or build picview-ffmpeg (osx-<platform>)
      - name: Cache picview-ffmpeg (osx-${{ matrix.platform }})
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: Build/ffmpeg-native/osx-${{ matrix.platform }}
          key: picview-ffmpeg-osx-${{ matrix.platform }}-${{ hashFiles('Build/Build-FFmpegNative.ps1', 'Build/ffmpeg/**', 'Native/ffmpeg/**') }}

      - name: Setup zig
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Build picview-ffmpeg (osx-${{ matrix.platform }})
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          brew install nasm make

          # FFmpeg needs GNU make; brew installs it keg-only as gmake, so expose
          # the directory containing it as 'make' to the build script
          $env:PV_EXTRA_PATH = Join-Path (brew --prefix make) 'libexec/gnubin'

          & "${{ github.workspace }}/Build/Build-FFmpegNative.ps1" -Targets @('osx-${{ matrix.platform }}')

      # Step 5: Decode MACOS_CERTIFICATE and configure build.keychain
      - name: Setup Keychain and Import Code-Signing Certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PWD="temp_keychain_pwd"
          CERTIFICATE_PATH="${RUNNER_TEMP}/certificate.p12"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$CERTIFICATE_PATH" -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain

          rm -f "$CERTIFICATE_PATH"

      # Step 6: Point PicView.Core at this architecture's Magick.NET package, then restore with the
      # same runtime and MagickLegacy value the publish uses, so the restore matches the build
      - name: Select Magick.NET package (${{ matrix.magick-package }})
        shell: pwsh
        run: |
          $coreProjectPath = "${{ github.workspace }}/src/PicView.Core/PicView.Core.csproj"
          [xml]$coreCsproj = Get-Content $coreProjectPath
          $packageNodes = $coreCsproj.Project.ItemGroup.PackageReference | Where-Object { $_.Include -match "^Magick\.NET-Q8-" }
          if (-not $packageNodes) {
              Write-Error "No Magick.NET-Q8-* PackageReference found in $coreProjectPath"
              exit 1
          }
          foreach ($packageNode in $packageNodes) {
              $packageNode.Include = "${{ matrix.magick-package }}"
          }
          $coreCsproj.Save($coreProjectPath)
          Write-Host "Using ${{ matrix.magick-package }} (MagickLegacy=${{ matrix.magick-legacy }})"

      - name: Restore dependencies
        run: >-
          dotnet restore src/PicView.Avalonia.MacOS/PicView.Avalonia.MacOS.csproj
          --runtime osx-${{ matrix.platform }}
          -p:MagickLegacy=${{ matrix.magick-legacy }}

      # Step 7: Build, Sign, Notarize, and Create DMG
      - name: Build, Sign, Notarize, and Create DMG (${{ matrix.platform }})
        shell: pwsh
        env:
          APPLE_ID: ${{ secrets.AppleID || secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.AppPassword || secrets.APP_PASSWORD }}
          TEAM_ID: ${{ secrets.TeamID || secrets.TEAM_ID || 'VR9BBW77YF' }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          $repoRoot = "${{ github.workspace }}"
          $outputRoot = Join-Path $repoRoot "Build/output"
          $version = "${{ steps.get-version.outputs.version }}".Trim()
          $platform = "${{ matrix.platform }}"
          $platformLabel = $platform.ToUpperInvariant()
          $macOSArchitecture = "${{ matrix.macos-architecture }}"
          $magickLegacy = "${{ matrix.magick-legacy }}"
          $entitlementsPath = Join-Path $repoRoot "src/PicView.Core.MacOS/entitlements.plist"
          $signingIdentity = $env:SIGNING_IDENTITY
          $appleID = $env:APPLE_ID
          $appPassword = $env:APP_PASSWORD
          $teamID = $env:TEAM_ID

          # Auto-detect signing identity from keychain if not explicitly provided via secret
          if ([string]::IsNullOrWhiteSpace($signingIdentity)) {
              $identitiesOutput = & /usr/bin/security find-identity -v -p codesigning build.keychain | Out-String
              if ($identitiesOutput -match '"(Developer ID Application:[^"]+)"') {
                  $signingIdentity = $Matches[1]
              } else {
                  $signingIdentity = "Developer ID Application: Ruben Hyldgaard Negendahl (VR9BBW77YF)"
              }
          }

          if ([string]::IsNullOrWhiteSpace($appleID) -or [string]::IsNullOrWhiteSpace($appPassword)) {
              Write-Error "AppleID and AppPassword secrets are required for notarization."
              exit 1
          }

          Write-Host "Building PicView v$version for macOS ($platform)..."

          # --- 1. The Magick.NET package was selected in the 'Select Magick.NET package' step ---

          # --- 2. Prepare output directories ---
          $platformFolder = "PicView-v$version-osx-$platform"
          $platformOutput = Join-Path $outputRoot $platformFolder

          if (Test-Path $platformOutput) {
              Remove-Item -Recurse -Force $platformOutput
          }
          New-Item -ItemType Directory -Force -Path $platformOutput | Out-Null

          $tempBuildPath = Join-Path $platformOutput "temp"
          New-Item -ItemType Directory -Force -Path $tempBuildPath | Out-Null

          # --- 3. Publish PicView.Avalonia.MacOS ---
          $avaloniaProjectPath = Join-Path $repoRoot "src/PicView.Avalonia.MacOS/PicView.Avalonia.MacOS.csproj"

          dotnet publish $avaloniaProjectPath `
              --runtime "osx-$platform" `
              --self-contained true `
              --configuration Release `
              -p:UseAppHost=true `
              -p:PublishSingleFile=false `
              -p:MagickLegacy=$magickLegacy `
              --output $tempBuildPath

          if ($LASTEXITCODE -ne 0) {
              Write-Error "dotnet publish failed with exit code $LASTEXITCODE"
              exit 1
          }

          # --- 4. Assemble PicView.app bundle ---
          $appBundlePath = Join-Path $platformOutput "PicView.app"
          $contentsPath = Join-Path $appBundlePath "Contents"
          $macOSPath = Join-Path $contentsPath "MacOS"
          $resourcesPath = Join-Path $contentsPath "Resources"

          New-Item -ItemType Directory -Force -Path $macOSPath | Out-Null
          New-Item -ItemType Directory -Force -Path $resourcesPath | Out-Null

          $infoPlistTemplatePath = Join-Path $repoRoot "src/PicView.Core.MacOS/Info.plist"
          $infoPlistPath = Join-Path $contentsPath "Info.plist"

          $infoPlistContent = Get-Content $infoPlistTemplatePath -Raw
          $infoPlistContent = $infoPlistContent -replace "{{appVersion}}", $version
          $infoPlistContent = $infoPlistContent -replace "{{platform}}", $macOSArchitecture

          $utf8NoBomEncoding = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($infoPlistPath, $infoPlistContent, $utf8NoBomEncoding)

          Copy-Item -Path "$tempBuildPath/*" -Destination $macOSPath -Recurse

          $iconSource = Join-Path $repoRoot "src/PicView.Avalonia.MacOS/Assets/AppIcon.icns"
          if (Test-Path $iconSource) {
              Copy-Item -Path $iconSource -Destination $resourcesPath
          }

          Get-ChildItem -Path $macOSPath -Filter "*.pdb" -Recurse | Remove-Item -Force
          Remove-Item -Path $tempBuildPath -Recurse -Force
          Get-ChildItem -Path $platformOutput | Where-Object { $_.Name -ne "PicView.app" } | Remove-Item -Recurse -Force

          Get-ChildItem -Path $macOSPath -File -Recurse | ForEach-Object {
              if ($_.Extension -in @('.dylib', '') -or $_.Name -eq 'PicView.Avalonia.MacOS' -or $_.Name -eq 'PicView') {
                  & chmod +x $_.FullName
              }
          }
          & chmod -R 755 $appBundlePath

          Write-Host "Build complete: $appBundlePath"

          # --- 5. Code Signing (inside-out: sign subcomponents before main executable and app bundle) ---
          Write-Host "[INFO] Signing $platformLabel app: $appBundlePath"
          Write-Host "[INFO] Using entitlements: $entitlementsPath"
          Write-Host "[INFO] Using signing identity: $signingIdentity"

          # Sign all nested subcomponents first (excluding the CFBundleExecutable 'PicView',
          # because signing 'PicView' validates the entire bundle and requires all subcomponents
          # such as Config/Languages/*.json and plugins/ffmpeg/* to already be signed).
          Get-ChildItem -Path $macOSPath -File -Recurse |
              Where-Object { $_.Name -ne 'PicView' } |
              ForEach-Object {
                  Write-Host "[INFO] Signing $($_.FullName)"
                  & /usr/bin/codesign --force --timestamp --options=runtime --entitlements "$entitlementsPath" --sign "$signingIdentity" "$($_.FullName)"
                  if ($LASTEXITCODE -ne 0) {
                      Write-Error "Failed to sign file: $($_.FullName)"
                      exit 1
                  }
              }

          # Now sign the main executable and the .app bundle itself
          Write-Host "[INFO] Signing $platformLabel app bundle"
          & /usr/bin/codesign --force --timestamp --options=runtime --entitlements "$entitlementsPath" --sign "$signingIdentity" "$appBundlePath" -v
          if ($LASTEXITCODE -ne 0) {
              Write-Error "App bundle signing failed with exit code $LASTEXITCODE"
              exit 1
          }

          & /usr/bin/codesign --verify --deep --strict --verbose=2 "$appBundlePath"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "App bundle signature verification failed with exit code $LASTEXITCODE"
              exit 1
          }

          Write-Host "App signing completed successfully."

          # --- 6. App Notarization & Stapling ---
          $tempNotarizeDir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $tempNotarizeDir | Out-Null

          $appZip = Join-Path $tempNotarizeDir "PicView-$version-$platform.zip"
          $notarizeResultFile = Join-Path $tempNotarizeDir "$platform-notarization-result.txt"

          Write-Host "[INFO] Creating zip archive for $platformLabel app notarization..."
          & ditto -c -k --keepParent "$appBundlePath" "$appZip"

          Write-Host "[INFO] Uploading $appZip to Apple notary service..."
          & xcrun notarytool submit "$appZip" `
              --apple-id "$appleID" `
              --password "$appPassword" `
              --team-id "$teamID" `
              --wait *>&1 | Out-File -FilePath $notarizeResultFile

          $resultContent = Get-Content -Path $notarizeResultFile -Raw
          Write-Host $resultContent

          if ($LASTEXITCODE -ne 0) {
              Remove-Item -Path $tempNotarizeDir -Recurse -Force
              Write-Error "Failed to submit $platformLabel app for notarization."
              exit 1
          }

          if ($resultContent -match "(?m)^\s+status:\s*Accepted\s*$") {
              Write-Host "[INFO] Notarization successful for $platformLabel app."
          } else {

              if ($resultContent -match "([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})") {
                  $submissionId = $Matches[1]
                  $logFile = Join-Path $tempNotarizeDir "$platform-notarization-log.json"
                  & xcrun notarytool log "$submissionId" `
                      --apple-id "$appleID" `
                      --password "$appPassword" `
                      --team-id "$teamID" `
                      "$logFile"
                  if (Test-Path $logFile) {
                      Get-Content -Path $logFile | Write-Host
                  }
              }

              Remove-Item -Path $tempNotarizeDir -Recurse -Force
              Write-Error "Notarization failed or incomplete for $platformLabel app."
              exit 1
          }

          Remove-Item -Path $tempNotarizeDir -Recurse -Force

          Write-Host "[INFO] Stapling notarization ticket to $appBundlePath"
          & xcrun stapler staple "$appBundlePath"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to staple notarization ticket to $platformLabel app."
              exit 1
          }

          Write-Host "[INFO] Verifying $platformLabel app with spctl"
          & spctl --assess --type exec "$appBundlePath"
          Write-Host "App notarization and stapling completed successfully."

          # --- 7. Create, Sign, Notarize & Staple DMG ---
          $dmgName = "PicView-$version-macOS-$platform"
          $dmgOutputPath = Join-Path $outputRoot "$dmgName.dmg"

          $tempDmgDir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $tempDmgDir | Out-Null

          Write-Host "Preparing DMG contents in temporary directory: $tempDmgDir"
          Copy-Item -Path $appBundlePath -Destination $tempDmgDir -Recurse
          & ln -s /Applications "$tempDmgDir/Applications"

          Write-Host "Creating DMG file: $dmgOutputPath"
          & hdiutil create -volname $dmgName -srcfolder $tempDmgDir -ov -format UDZO $dmgOutputPath

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create DMG file: $dmgOutputPath"
              Remove-Item -Path $tempDmgDir -Recurse -Force
              exit 1
          }

          Remove-Item -Path $tempDmgDir -Recurse -Force

          Write-Host "Signing DMG with identity: $signingIdentity"
          & codesign --force --sign "$signingIdentity" "$dmgOutputPath"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to sign DMG file: $dmgOutputPath"
              exit 1
          }

          Write-Host "Submitting DMG for notarization: $dmgOutputPath"
          $dmgNotarizeOutput = [System.IO.Path]::GetTempFileName()

          & xcrun notarytool submit "$dmgOutputPath" `
              --apple-id "$appleID" `
              --password "$appPassword" `
              --team-id "$teamID" `
              --wait *>&1 | Out-File -FilePath $dmgNotarizeOutput

          # The pwsh shell on GitHub runners sets $ErrorActionPreference = 'Stop', so Write-Error
          # ends the step at once: print the notarytool output and log before it, not after.
          $dmgResult = Get-Content -Path $dmgNotarizeOutput -Raw
          Write-Host $dmgResult

          if ($LASTEXITCODE -ne 0) {
              Remove-Item -Path $dmgNotarizeOutput -Force
              Write-Error "Failed to submit DMG for notarization: $dmgOutputPath"
              exit 1
          }

          # 'notarytool --wait' prints 'Current status: In Progress' lines while it waits, so the first
          # 'status:' line is not the result. The final result is the indented 'status:' line at the end.
          $dmgAccepted = $dmgResult -match "(?m)^\s+status:\s*Accepted\s*$"
          if ($dmgAccepted) {
              Write-Host "DMG notarization successful: $dmgOutputPath"

              Write-Host "Stapling notarization ticket to DMG"
              & xcrun stapler staple "$dmgOutputPath"
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to staple notarization ticket to DMG: $dmgOutputPath"
                  Remove-Item -Path $dmgNotarizeOutput -Force
                  exit 1
              }

              Write-Host "Successfully stapled notarization ticket to DMG: $dmgOutputPath"
              & xcrun stapler validate "$dmgOutputPath"
          } else {
              if ($dmgResult -match "([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})") {
                  $dmgLogFile = Join-Path ([System.IO.Path]::GetTempPath()) "dmg-notarization-log.json"
                  & xcrun notarytool log "$($Matches[1])" `
                      --apple-id "$appleID" `
                      --password "$appPassword" `
                      --team-id "$teamID" `
                      "$dmgLogFile"
                  if (Test-Path $dmgLogFile) {
                      Get-Content -Path $dmgLogFile | Write-Host
                  }
              }
              Remove-Item -Path $dmgNotarizeOutput -Force
              Write-Error "DMG notarization failed: $dmgOutputPath"
              exit 1
          }

          Remove-Item -Path $dmgNotarizeOutput -Force
          Write-Host "All processes completed successfully! DMG at: $dmgOutputPath"

      # Step 8: Upload the notarized DMG on its own, unzipped. The notarized app is inside it.
      # (Uploading PicView.app as well put an extra copy in a zip, and zipping it drops the
      # symlinks and extended attributes its signature and stapled ticket depend on.)
      # archive: false names the artifact after the file and ignores 'name'.
      - name: Upload notarized ${{ matrix.platform }} DMG
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: ${{ github.workspace }}/Build/output/PicView-${{ steps.get-version.outputs.version }}-macOS-${{ matrix.platform }}.dmg
          retention-days: 14
